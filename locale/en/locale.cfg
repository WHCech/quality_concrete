[mod-setting-name]
debug-spawn-all-tiles=Debug: spawn all tiles on start

[mod-setting-description]
debug-spawn-all-tiles=When enabled, spawns a centered preview grid of all Quality Concrete tiles when the first player is created.

[quality_concrete]
dependency-notice=[color=yellow]Quality Concrete[/color] now uses [color=yellow]Runtime Spoilage Engine[/color] instead of Runtime Spoilage Library. Runtime Spoilage Library is no longer needed by this mod and can be removed.
